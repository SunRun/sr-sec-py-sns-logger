[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sr-sec-py-sns-logger"
version = "1.1.0"
description = "Python security logging module for sending structured security logs to AWS SNS"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "SunRun Security Team", email = "sec-software-team@sunrun.com"}
]
keywords = ["security", "logging", "aws", "sns", "audit", "compliance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
requires-python = ">=3.9"
dependencies = [
    "boto3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/SunRun/sr-sec-py-sns-logger"
Repository = "https://github.com/SunRun/sr-sec-py-sns-logger.git"
Packages = "https://github.com/SunRun/releases"
Documentation = "https://github.com/SunRun/sr-sec-py-sns-logger#readme"

# Include the root-level Python modules as the package
[tool.setuptools]
py-modules = ["security_logging_sns", "security_log_fields", "sns_publisher"]
